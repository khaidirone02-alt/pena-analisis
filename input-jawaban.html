<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#3498db">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Input Jawaban Siswa - PenaAnalisis</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <style>
        :root { --primary-blue: #3498db; --border-color: #dee2e6; }
        body { font-family: 'Segoe UI', sans-serif; background: white; margin: 0; padding: 20px; }
        
        h2 { font-size: 18px; color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; }

        /* --- BAGIAN STICKY (FREEZE) --- */
        .sticky-container {
            position: -webkit-sticky; /* Dukungan Safari */
            position: sticky;
            top: 0;
            background: white;
            z-index: 1000;
            padding-bottom: 15px;
            border-bottom: 3px solid var(--primary-blue);
            margin-bottom: 10px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .section-box { margin-top: 10px; }
        label { font-size: 11px; font-weight: bold; color: #3498db; display: block; margin-bottom: 5px; text-transform: uppercase; }

        .grid-jawaban {
            display: flex; flex-wrap: wrap; gap: 4px; background: #fdfdfd;
            padding: 10px; border: 1px solid #ddd; border-radius: 4px;
        }

        .item-soal { 
            display: flex; flex-direction: column; align-items: center; 
            width: 30px; 
            margin-bottom: 8px;
        }

        .nomor-soal { 
            font-size: 9px; color: #888; margin-bottom: 2px; font-weight: bold; 
        }

        .box-input {
            width: 25px; height: 25px; text-align: center; border: 1px solid #ccc;
            border-radius: 3px; font-weight: bold; text-transform: uppercase;
            font-size: 13px;
        }

        .box-input:focus { border-color: var(--primary-blue); background: #e8f4fd; outline: none; }

        table { 
            width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; 
        }
        
        /* Membuat Header Tabel juga ikut Sticky agar tetap terlihat No/Nama */
        thead th { 
            position: sticky; 
            top: 135px; /* Menyesuaikan tinggi kontainer kunci di atasnya */
            background: #f8f9fa; 
            z-index: 900; 
            padding: 12px 10px; 
            border: 1px solid var(--border-color);
        }

        td { padding: 12px 10px; border: 1px solid var(--border-color); }
        
        .no-col { text-align: center; width: 40px; }
        .nama-col { width: 200px; font-weight: bold; text-transform: uppercase; }
        .status-save { font-size: 10px; color: #27ae60; margin-left: 10px; display: none; }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            body { padding: 10px; }
            
            .sticky-container {
                padding-bottom: 10px;
                margin-bottom: 5px;
            }
            
            .grid-jawaban {
                gap: 2px;
                padding: 8px;
                justify-content: center;
            }
            
            .item-soal { 
                width: 28px;
                margin-bottom: 6px;
            }
            
            .box-input {
                width: 24px; 
                height: 24px; 
                font-size: 12px;
            }
            
            .nomor-soal { 
                font-size: 8px; 
                margin-bottom: 1px;
            }
            
            table {
                font-size: 12px;
                margin-top: 5px;
            }
            
            thead th {
                top: 120px; /* Adjust for mobile */
                padding: 8px 6px;
                font-size: 11px;
            }
            
            td { 
                padding: 8px 6px; 
            }
            
            .no-col { 
                width: 30px; 
                font-size: 11px;
            }
            
            .nama-col { 
                width: 150px; 
                font-size: 11px;
                word-break: break-word;
            }
            
            /* Make grid more compact on mobile */
            .grid-jawaban {
                max-width: 100%;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            
            /* Better touch targets */
            .box-input {
                min-height: 32px;
                min-width: 32px;
            }
            
            /* Prevent zoom on input focus for iOS */
            .box-input, .box-input:focus {
                font-size: 16px; /* Prevent zoom on iOS */
            }
        }
        
        @media (max-width: 480px) {
            .nama-col { 
                width: 120px; 
                font-size: 10px;
            }
            
            .item-soal { 
                width: 26px;
            }
            
            .box-input {
                width: 22px; 
                height: 22px; 
                font-size: 11px;
                min-height: 30px;
                min-width: 30px;
            }
            
            .grid-jawaban {
                padding: 6px;
                gap: 1px;
            }
        }
    </style>
</head>
<body>

    <!-- Kontainer yang di-Freeze -->
    <div class="sticky-container">
        <h2>3. ANALISIS JAWABAN <span id="save-indicator" class="status-save">Menyimpan...</span></h2>
        <div id="info-kelas-aktif" style="margin-bottom:10px; font-size:12px;">Memuat...</div>

        <div class="section-box">
            <label>Kunci Jawaban (Master)</label>
            <div id="grid-kunci-master" class="grid-jawaban"></div>
        </div>
    </div>

    <!-- Bagian yang digulir -->
    <table>
        <thead>
            <tr>
                <th class="no-col">No</th>
                <th class="nama-col">Nama Siswa</th>
                <th>Input Jawaban</th>
            </tr>
        </thead>
        <tbody id="tabel-input-jawaban"></tbody>
    </table>

<script>
    // Konfigurasi Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBq93zwNxWHkBs21i-58v0EhpztkaU3_W4",
        authDomain: "analisis-app-d8d93.firebaseapp.com",
        databaseURL: "https://analisis-app-d8d93-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "analisis-app-d8d93",
        storageBucket: "analisis-app-d8d93.firebasestorage.app",
        messagingSenderId: "1088329722308",
        appId: "1:1088329722308:web:70c80e5b59fc210bff1c91"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let uid = "", kelasAktif = "", saveTimeout;
    const JUMLAH_SOAL = 50;
    let siswaKeys = []; // Array untuk menyimpan urutan kunci siswa
    let siswaData = {}; // Object untuk menyimpan data siswa dengan keySiswa sebagai key

    firebase.auth().onAuthStateChanged((user) => {
        if (user) {
            uid = user.uid;
            initApp();
        }
    });

    function initApp() {
        buatGridKunciMaster();
        db.ref(`users_data/${uid}/pengaturan/kelas_aktif`).on('value', (snap) => {
            kelasAktif = snap.val();
            document.getElementById('info-kelas-aktif').innerHTML = `Kelas Aktif: <b>${kelasAktif}</b>`;
            loadDaftarSiswaJawaban();
        });
    }

    function buatGridKunciMaster() {
        const container = document.getElementById('grid-kunci-master');
        let html = "";
        for (let i = 1; i <= JUMLAH_SOAL; i++) {
            html += `
                <div class="item-soal">
                    <span class="nomor-soal">${i}</span>
                    <input type="text" maxlength="1" class="box-input master-idx" 
                           id="m_${i}" oninput="handleInput(this, 'master', '', ${i})"
                           onkeydown="handleKeyDown(event, this, 'master', '', ${i})"
                           onfocus="this.select()">
                </div>`;
        }
        container.innerHTML = html;
        
        db.ref(`users_data/${uid}/kunci_jawaban`).once('value', (snap) => {
            if(snap.exists()) {
                const kunci = snap.val().split("");
                kunci.forEach((h, i) => { if(i < JUMLAH_SOAL) document.getElementById(`m_${i+1}`).value = h === "-" ? "" : h; });
            }
        });
    }

    function loadDaftarSiswaJawaban() {
        db.ref(`users_data/${uid}/peserta_didik`).orderByChild("kelas").equalTo(kelasAktif).once('value', (snap) => {
            const tbody = document.getElementById('tabel-input-jawaban');
            tbody.innerHTML = "";
            siswaKeys = []; // Reset array siswa
            siswaData = {}; // Reset object siswa
            let no = 1;

            snap.forEach((child) => {
                const s = child.val();
                const keySiswa = child.key;
                siswaKeys.push(keySiswa); // Simpan urutan kunci siswa
                siswaData[keySiswa] = { nama: s.nama, no: no }; // Simpan data siswa
                const jwbArr = (s.jawaban || "").split("");

                let gridSiswa = `<div class="grid-jawaban">`;
                for (let j = 1; j <= JUMLAH_SOAL; j++) {
                    let huruf = jwbArr[j-1] || "";
                    gridSiswa += `
                        <div class="item-soal">
                            <span class="nomor-soal">${j}</span>
                            <input type="text" maxlength="1" class="box-input s-idx-${keySiswa}" 
                                   id="s_${keySiswa}_${j}" value="${huruf === "-" ? "" : huruf}"
                                   oninput="handleInput(this, 'siswa', '${keySiswa}', ${j})"
                                   onkeydown="handleKeyDown(event, this, 'siswa', '${keySiswa}', ${j})"
                                   onfocus="this.select()">
                        </div>`;
                }
                gridSiswa += `</div>`;

                tbody.innerHTML += `<tr><td class="no-col">${no++}</td><td class="nama-col">${s.nama}</td><td>${gridSiswa}</td></tr>`;
            });
        });
    }

    function handleInput(el, tipe, keySiswa, index) {
        el.value = el.value.toUpperCase();
        
        if (el.value.length === 1 && index < JUMLAH_SOAL) {
            const nextId = tipe === 'master' ? `m_${index+1}` : `s_${keySiswa}_${index+1}`;
            const nextEl = document.getElementById(nextId);
            if(nextEl) nextEl.focus();
        }

        clearTimeout(saveTimeout);
        document.getElementById('save-indicator').style.display = 'inline';
        
        saveTimeout = setTimeout(() => {
            if (tipe === 'master') {
                saveMaster();
            } else {
                saveSiswa(keySiswa);
            }
            document.getElementById('save-indicator').style.display = 'none';
        }, 1000);
    }

    function handleKeyDown(event, el, tipe, keySiswa, index) {
        const key = event.key;

        if (key === 'ArrowRight') {
            event.preventDefault();
            if (index < JUMLAH_SOAL) {
                const nextId = tipe === 'master' ? `m_${index + 1}` : `s_${keySiswa}_${index + 1}`;
                const nextEl = document.getElementById(nextId);
                if (nextEl) nextEl.focus();
            }
            return;
        }

        if (key === 'ArrowLeft') {
            event.preventDefault();
            if (index > 1) {
                const prevId = tipe === 'master' ? `m_${index - 1}` : `s_${keySiswa}_${index - 1}`;
                const prevEl = document.getElementById(prevId);
                if (prevEl) prevEl.focus();
            }
            return;
        }

        // Navigasi vertikal dalam grid (atas/bawah pindah dalam kolom yang sama)
        if (key === 'ArrowDown') {
            event.preventDefault();
            const gridContainer = el.closest('.grid-jawaban');
            if (gridContainer) {
                const colsPerRow = hitungKolomPerBaris(gridContainer);
                const nextIndex = index + colsPerRow;
                
                if (nextIndex <= JUMLAH_SOAL) {
                    const nextId = tipe === 'master' ? `m_${nextIndex}` : `s_${keySiswa}_${nextIndex}`;
                    const nextEl = document.getElementById(nextId);
                    if (nextEl) nextEl.focus();
                }
            }
            return;
        }

        if (key === 'ArrowUp') {
            event.preventDefault();
            const gridContainer = el.closest('.grid-jawaban');
            if (gridContainer) {
                const colsPerRow = hitungKolomPerBaris(gridContainer);
                const prevIndex = index - colsPerRow;
                
                if (prevIndex >= 1) {
                    const prevId = tipe === 'master' ? `m_${prevIndex}` : `s_${keySiswa}_${prevIndex}`;
                    const prevEl = document.getElementById(prevId);
                    if (prevEl) prevEl.focus();
                }
            }
            return;
        }

        if (key === 'Backspace') {
            if (el.value === '' && index > 1) {
                event.preventDefault();
                const prevId = tipe === 'master' ? `m_${index - 1}` : `s_${keySiswa}_${index - 1}`;
                const prevEl = document.getElementById(prevId);
                if (prevEl) {
                    prevEl.focus();
                    prevEl.value = '';
                    handleInput(prevEl, tipe, keySiswa, index - 1);
                }
            }
        }
    }

    function hitungKolomPerBaris(container) {
        // Hitung jumlah kolom berdasarkan posisi Y elemen
        const items = container.querySelectorAll('.item-soal');
        if (items.length < 2) return 1;
        
        const firstItemY = items[0].getBoundingClientRect().top;
        let colsPerRow = 1;
        
        for (let i = 1; i < items.length; i++) {
            const itemY = items[i].getBoundingClientRect().top;
            if (Math.abs(itemY - firstItemY) < 5) { // Toleransi 5px untuk keselarasan
                colsPerRow++;
            } else {
                break; // Sudah ke baris berikutnya
            }
        }
        
        return colsPerRow;
    }

    function saveMaster() {
        let str = "";
        document.querySelectorAll('.master-idx').forEach(inp => { str += inp.value || "-"; });
        db.ref(`users_data/${uid}/kunci_jawaban`).set(str);
    }

    function saveSiswa(key) {
        let str = "";
        document.querySelectorAll(`.s-idx-${key}`).forEach(inp => { str += inp.value || "-"; });
        db.ref(`users_data/${uid}/peserta_didik/${key}`).update({ jawaban: str });
    }

    // Mobile optimization functions
    function initMobileOptimizations() {
        // Prevent zoom on input focus for iOS
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
            document.querySelectorAll('.box-input').forEach(input => {
                input.addEventListener('focus', function() {
                    // Temporarily set font size to prevent zoom
                    this.style.fontSize = '16px';
                });
                input.addEventListener('blur', function() {
                    // Reset font size
                    this.style.fontSize = '';
                });
            });
        }

        // Add touch feedback for better UX
        document.querySelectorAll('.box-input').forEach(input => {
            input.addEventListener('touchstart', function() {
                this.style.transform = 'scale(0.95)';
            });
            input.addEventListener('touchend', function() {
                this.style.transform = '';
            });
        });

        // Handle viewport height changes (keyboard show/hide)
        let viewportHeight = window.innerHeight;
        window.addEventListener('resize', function() {
            if (Math.abs(window.innerHeight - viewportHeight) > 150) {
                // Keyboard likely shown/hidden, adjust layout if needed
                viewportHeight = window.innerHeight;
            }
        });
    }

    // Initialize mobile optimizations on load
    window.addEventListener('load', initMobileOptimizations);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Peserta Didik</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
    <!-- SheetJS untuk membaca Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary: #3498db;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --gray-bg: #f4f7f6;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: white; margin: 0; padding: clamp(10px, 3vw, 20px); color: #333; }
        h2 { font-size: clamp(16px, 4vw, 18px); margin-bottom: clamp(15px, 4vw, 20px); color: #2c3e50; }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: clamp(15px, 3vw, 20px);
            margin-bottom: clamp(15px, 3vw, 20px);
            background: #fff;
        }

        .filter-section {
            background: #eef7ff;
            border: 1px solid #b6d4fe;
            padding: clamp(12px, 2.5vw, 15px);
            border-radius: 8px;
            margin-bottom: clamp(15px, 3vw, 20px);
            display: flex;
            align-items: center;
            gap: clamp(10px, 2vw, 15px);
            flex-wrap: wrap;
        }

        .card-title { font-size: clamp(12px, 3vw, 14px); font-weight: bold; margin-bottom: clamp(12px, 2vw, 15px); display: block; }
        .form-inline { display: flex; gap: clamp(10px, 2vw, 15px); align-items: flex-end; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: clamp(10px, 2vw, 12px); font-weight: bold; margin-bottom: clamp(4px, 1vw, 5px); color: #666; }
        
        input, select {
            padding: clamp(8px, 2vw, 12px);
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: clamp(12px, 2.5vw, 14px);
            min-height: 44px;
        }

        .btn {
            padding: clamp(8px, 1.5vw, 10px) clamp(15px, 3vw, 20px);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: clamp(11px, 2vw, 13px);
            color: white;
            transition: 0.3s;
            min-height: 40px;
        }
        .btn-tambah { background: var(--success); }
        .btn-update { background: var(--primary); }
        .btn-batal { background: #7f8c8d; }
        .btn-import { background: #9b59b6; }
        .btn-import:hover { background: #8e44ad; }
        .btn-edit { background: var(--warning); padding: clamp(4px, 1vw, 6px) clamp(8px, 1.5vw, 10px); margin-right: 5px; font-size: clamp(10px, 1.5vw, 11px); }
        .btn-edit:hover { background: #e67e22; }
        .btn-hapus { background: var(--danger); padding: clamp(4px, 1vw, 6px) clamp(8px, 1.5vw, 10px); font-size: clamp(10px, 1.5vw, 11px); }
        .btn-hapus:hover { background: #c0392b; }

        table { width: 100%; border-collapse: collapse; margin-top: clamp(8px, 2vw, 10px); font-size: clamp(11px, 2vw, 13px); overflow-x: auto; }
        th { background: #f8f9fa; color: #555; text-align: left; padding: clamp(8px, 1.5vw, 12px) clamp(6px, 1.5vw, 10px); border: 1px solid #dee2e6; font-size: clamp(11px, 2vw, 13px); }
        td { padding: clamp(8px, 1.5vw, 10px) clamp(6px, 1.5vw, 10px); border: 1px solid #dee2e6; vertical-align: middle; font-size: clamp(11px, 1.5vw, 12px); }
        tr:nth-child(even) { background-color: #fcfcfc; }
        
        .text-center { text-align: center; }
        .uppercase { text-transform: uppercase; }
        .filter-label { font-weight: bold; color: #004085; font-size: clamp(12px, 3vw, 14px); }
    </style>
</head>
<body>

    <h2>2. PESERTA DIDIK</h2>

    <!-- FILTER KELAS (SINKRONISASI UTAMA) -->
    <div class="filter-section">
        <span class="filter-label">Pilih Kelas Aktif:</span>
        <select id="filter_kelas" onchange="gantiKelasAktif(this.value)" style="width: 150px; font-weight: bold; border-color: var(--primary);">
            <option value="">Memuat...</option>
        </select>
        <small style="color: #666;">*Data di Menu 3, 4, 5, dan 6 akan ikut berganti sesuai kelas ini.</small>
    </div>

    <!-- FORM PENGISIAN -->
    <div class="card">
        <span id="form-label" class="card-title">Tambah Siswa Baru</span>
        <div class="form-inline">
            <input type="hidden" id="edit_key">
            <div class="form-group">
                <label>Nama Siswa</label>
                <input type="text" id="in_nama" placeholder="Masukkan nama..." style="width: 250px;">
            </div>
            <div class="form-group">
                <label>L/P</label>
                <select id="in_lp">
                    <option value="L">Laki-laki (L)</option>
                    <option value="P">Perempuan (P)</option>
                </select>
            </div>
            
            <button id="btn-submit" class="btn btn-tambah" onclick="simpanSiswa()">Tambah</button>
            <button id="btn-batal" class="btn btn-batal" onclick="resetForm()" style="display:none;">Batal</button>
        </div>
    </div>

    <!-- IMPORT DARI EXCEL -->
    <div class="card">
        <span class="card-title">Import dari Excel</span>
        <div class="form-inline">
            <div class="form-group">
                <label>File Excel (.xlsx, .xls)</label>
                <input type="file" id="excel_file" accept=".xlsx,.xls" style="width: 250px; padding: 5px;">
            </div>
            <div class="form-group">
                <label>Sheet Name (opsional)</label>
                <input type="text" id="sheet_name" placeholder="Sheet1" style="width: 100px;" value="Sheet1">
            </div>
            <div class="form-group">
                <label>Default L/P</label>
                <select id="default_lp">
                    <option value="L">Laki-laki (L)</option>
                    <option value="P">Perempuan (P)</option>
                </select>
            </div>
            <button class="btn btn-import" onclick="importDariExcel()">Import Excel</button>
        </div>
        <small style="color: #666; margin-top: 10px; display: block;">
            * Format Excel: Setiap sel berisi satu nama siswa. Kosongkan sel untuk mengakhiri pembacaan.
        </small>
    </div>

    <table>
        <thead>
            <tr>
                <th width="40" class="text-center">No</th>
                <th>Nama Peserta Didik</th>
                <th width="100" class="text-center">Kelas</th>
                <th width="60" class="text-center">L/P</th>
                <th width="150" class="text-center">Aksi</th>
            </tr>
        </thead>
        <tbody id="tabel-siswa">
            <tr><td colspan="5" class="text-center">Pilih kelas terlebih dahulu...</td></tr>
        </tbody>
    </table>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBq93zwNxWHkBs21i-58v0EhpztkaU3_W4",
        authDomain: "analisis-app-d8d93.firebaseapp.com",
        databaseURL: "https://analisis-app-d8d93-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "analisis-app-d8d93",
        storageBucket: "analisis-app-d8d93.firebasestorage.app",
        messagingSenderId: "1088329722308",
        appId: "1:1088329722308:web:70c80e5b59fc210bff1c91"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let uid = "";
    let kelasSekarang = "";

    firebase.auth().onAuthStateChanged((user) => {
        if (user) {
            uid = user.uid;
            initHalaman();
        }
    });

    async function initHalaman() {
        // 1. Ambil TP Aktif untuk menentukan path list_kelas
        db.ref(`users_data/${uid}/pengaturan/tp_aktif`).on('value', (sTP) => {
            const tp = sTP.val();
            if (!tp) {
                document.getElementById('filter_kelas').innerHTML = '<option value="">TP Belum Diatur</option>';
                return;
            }
            const tpPath = tp.replace(/\//g, '_');

            // 2. Load Opsi Kelas dari Identitas Penilaian (Menu 1) sesuai TP aktif
            db.ref(`users_data/${uid}/tahun_pelajaran/${tpPath}/identitas/list_kelas`).on('value', (snap) => {
                const list = snap.val() || [];
                const filterSelect = document.getElementById('filter_kelas');
                filterSelect.innerHTML = '<option value="">-- Pilih Kelas --</option>';
                
                list.forEach(kls => {
                    let opt = document.createElement('option');
                    opt.value = kls; 
                    opt.text = "Kelas " + kls;
                    filterSelect.appendChild(opt);
                });

                // 3. Sinkronkan dengan Kelas Aktif yang tersimpan di pengaturan global
                db.ref(`users_data/${uid}/pengaturan/kelas_aktif`).once('value', (sAktif) => {
                    if(sAktif.exists()) {
                        kelasSekarang = sAktif.val();
                        filterSelect.value = kelasSekarang;
                        loadSiswa();
                    }
                });
            });
        });
    }

    function gantiKelasAktif(kelas) {
        if(!kelas) return;
        kelasSekarang = kelas;
        // Simpan ke pengaturan global agar menu lain ikut berubah
        db.ref(`users_data/${uid}/pengaturan/kelas_aktif`).set(kelas)
        .then(() => {
            loadSiswa();
        });
    }

    function simpanSiswa() {
        if(!kelasSekarang) return alert("Pilih kelas di bagian atas terlebih dahulu!");
        
        const key = document.getElementById('edit_key').value;
        const nama = document.getElementById('in_nama').value.trim();
        const lp = document.getElementById('in_lp').value;

        if(!nama) return alert("Nama tidak boleh kosong!");

        const dataSiswa = {
            nama: nama.toUpperCase(),
            kelas: kelasSekarang,
            lp: lp
        };

        if(key) {
            db.ref(`users_data/${uid}/peserta_didik/${key}`).update(dataSiswa)
            .then(() => { resetForm(); });
        } else {
            const newKey = db.ref().child(`users_data/${uid}/peserta_didik`).push().key;
            db.ref(`users_data/${uid}/peserta_didik/${newKey}`).set(dataSiswa)
            .then(() => { resetForm(); });
        }
    }

    function loadSiswa() {
        if(!kelasSekarang) return;
        
        db.ref(`users_data/${uid}/peserta_didik`).on('value', (snap) => {
            const tbody = document.getElementById('tabel-siswa');
            tbody.innerHTML = "";
            let no = 1;
            
            // Kumpulkan semua siswa dari kelas yang dipilih
            let siswaList = [];
            snap.forEach((child) => {
                const s = child.val();
                if(s.kelas === kelasSekarang) {
                    siswaList.push({
                        key: child.key,
                        nama: s.nama,
                        kelas: s.kelas,
                        lp: s.lp
                    });
                }
            });
            
            // Urutkan berdasarkan nama A-Z
            siswaList.sort((a, b) => a.nama.localeCompare(b.nama));
            
            // Tampilkan siswa yang sudah diurutkan
            siswaList.forEach(s => {
                tbody.innerHTML += `
                    <tr>
                        <td class="text-center">${no++}</td>
                        <td class="uppercase"><b>${s.nama}</b></td>
                        <td class="text-center">${s.kelas}</td>
                        <td class="text-center">${s.lp}</td>
                        <td class="text-center">
                            <button class="btn btn-edit" onclick="isiDataKeForm('${s.key}', '${s.nama}', '${s.lp}')">Edit</button>
                            <button class="btn btn-hapus" onclick="hapusSiswa('${s.key}')">Hapus</button>
                        </td>
                    </tr>
                `;
            });
            
            if(siswaList.length === 0) {
                tbody.innerHTML = `<tr><td colspan='5' class='text-center'>Belum ada data siswa di kelas ${kelasSekarang}.</td></tr>`;
            }
        });
    }

    function isiDataKeForm(key, nama, lp) {
        document.getElementById('edit_key').value = key;
        document.getElementById('in_nama').value = nama;
        document.getElementById('in_lp').value = lp;
        document.getElementById('form-label').innerText = "Edit Data Siswa - Kelas " + kelasSekarang;
        const btn = document.getElementById('btn-submit');
        btn.innerText = "Update";
        btn.className = "btn btn-update";
        document.getElementById('btn-batal').style.display = "inline-block";
        document.getElementById('in_nama').focus();
    }

    function resetForm() {
        document.getElementById('edit_key').value = "";
        document.getElementById('in_nama').value = "";
        document.getElementById('form-label').innerText = "Tambah Siswa Baru";
        const btn = document.getElementById('btn-submit');
        btn.innerText = "Tambah";
        btn.className = "btn btn-tambah";
        document.getElementById('btn-batal').style.display = "none";
    }

    function hapusSiswa(key) {
        if(confirm("Hapus data siswa ini?")) {
            db.ref(`users_data/${uid}/peserta_didik/${key}`).remove();
        }
    }

    // Fungsi Import dari Excel
    async function importDariExcel() {
        if(!kelasSekarang) {
            alert("Pilih kelas di bagian atas terlebih dahulu!");
            return;
        }

        const fileInput = document.getElementById('excel_file');
        const sheetName = document.getElementById('sheet_name').value.trim() || 'Sheet1';
        const defaultLp = document.getElementById('default_lp').value;

        if(!fileInput.files[0]) {
            alert("Pilih file Excel terlebih dahulu!");
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                
                // Cek apakah sheet ada
                if(!workbook.Sheets[sheetName]) {
                    alert(`Sheet "${sheetName}" tidak ditemukan. Sheet yang tersedia: ${Object.keys(workbook.Sheets).join(', ')}`);
                    return;
                }

                const worksheet = workbook.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});

                if(jsonData.length === 0) {
                    alert("File Excel kosong atau tidak valid!");
                    return;
                }

                // Kumpulkan semua nama siswa dari sel yang tidak kosong
                let namaSiswa = [];
                jsonData.forEach(row => {
                    row.forEach(cell => {
                        const nama = cell.toString().trim();
                        if(nama && nama !== "") {
                            namaSiswa.push(nama.toUpperCase());
                        }
                    });
                });

                if(namaSiswa.length === 0) {
                    alert("Tidak ada data nama siswa yang valid di file Excel!");
                    return;
                }

                // Konfirmasi sebelum import
                if(!confirm(`Import ${namaSiswa.length} siswa dari Excel?\n\nNama yang akan diimport:\n${namaSiswa.slice(0, 10).join(', ')}${namaSiswa.length > 10 ? '...' : ''}`)) {
                    return;
                }

                // Import siswa satu per satu
                let berhasil = 0;
                let gagal = 0;

                for(const nama of namaSiswa) {
                    try {
                        const dataSiswa = {
                            nama: nama,
                            kelas: kelasSekarang,
                            lp: defaultLp
                        };

                        const newKey = db.ref().child(`users_data/${uid}/peserta_didik`).push().key;
                        await db.ref(`users_data/${uid}/peserta_didik/${newKey}`).set(dataSiswa);
                        berhasil++;
                    } catch(error) {
                        console.error('Error importing student:', nama, error);
                        gagal++;
                    }
                }

                // Reset form
                fileInput.value = '';
                
                // Tampilkan hasil
                alert(`Import selesai!\n✅ Berhasil: ${berhasil} siswa\n❌ Gagal: ${gagal} siswa`);

            } catch(error) {
                console.error('Error reading Excel file:', error);
                alert('Error membaca file Excel: ' + error.message);
            }
        };

        reader.readAsArrayBuffer(file);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tentang Saya - PenaAnalisis</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-blue: #3498db;
            --primary-dark: #2c3e50;
            --success: #27ae60;
            --gray-light: #ecf0f1;
            --border-color: #ddd;
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: white; 
            margin: 0; 
            padding: calc(clamp(10px, 3vw, 20px) + env(safe-area-inset-bottom, 20px));
        }

        h2 {
            font-size: clamp(16px, 4vw, 20px);
            color: var(--primary-dark);
            border-bottom: 2px solid var(--gray-light);
            padding-bottom: clamp(8px, 2vw, 10px);
            margin-top: 0;
            margin-bottom: clamp(20px, 4vw, 25px);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: clamp(15px, 3vw, 20px);
            margin-bottom: clamp(25px, 5vw, 30px);
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: clamp(11px, 2.5vw, 12px);
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea {
            padding: clamp(10px, 2vw, 12px);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: clamp(13px, 2.5vw, 14px);
            font-family: inherit;
            min-height: 44px;
            background: #f9f9f9;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            background: white;
            border-color: var(--primary-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: clamp(10px, 2vw, 15px);
            flex-wrap: wrap;
            margin-bottom: calc(90px + env(safe-area-inset-bottom, 20px));
        }

        button {
            padding: clamp(10px, 2vw, 12px) clamp(20px, 3vw, 25px);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: clamp(12px, 2vw, 14px);
            transition: 0.3s;
            min-height: 44px;
            flex: 1;
            min-width: 120px;
        }

        .btn-simpan {
            background: var(--success);
            color: white;
        }

        .btn-simpan:hover {
            background: #229954;
            transform: translateY(-2px);
        }

        .btn-batal {
            background: #95a5a6;
            color: white;
        }

        .btn-batal:hover {
            background: #7f8c8d;
        }

        .info-box {
            background: #e8f4f8;
            border-left: 4px solid var(--primary-blue);
            padding: clamp(12px, 2vw, 15px);
            border-radius: 6px;
            margin-bottom: clamp(15px, 3vw, 20px);
            font-size: clamp(12px, 2vw, 13px);
            color: #2c3e50;
            line-height: 1.5;
        }

        .bottom-spacer {
            height: calc(90px + env(safe-area-inset-bottom, 20px));
            width: 100%;
        }
    </style>
</head>
<body>

    <h2>ℹ️ Tentang Saya (Developer Info)</h2>

    <div class="info-box">
        💡 Informasi ini akan ditampilkan di halaman utama dan Play Store. Isi dengan detail yang menarik tentang diri Anda atau institusi Anda.
    </div>

    <div class="form-grid">
        <div class="form-group">
            <label>Nama Lengkap / Institusi</label>
            <input type="text" id="nama_developer" placeholder="Contoh: Nama Guru atau Nama Sekolah">
        </div>

        <div class="form-group">
            <label>Email Kontak</label>
            <input type="email" id="email_kontak" placeholder="nama@email.com">
        </div>

        <div class="form-group">
            <label>Nomor Telepon / WhatsApp</label>
            <input type="tel" id="telepon_kontak" placeholder="08xxxxxxxxxx">
        </div>

        <div class="form-group">
            <label>Bidang / Kategori</label>
            <input type="text" id="bidang_kerja" placeholder="Contoh: Guru, Kepala Sekolah, Kurikulum">
        </div>

        <div class="form-group">
            <label>Tahun Pengalaman</label>
            <input type="number" id="tahun_pengalaman" placeholder="Contoh: 10" min="0">
        </div>

        <div class="form-group">
            <label>Lokasi / Sekolah</label>
            <input type="text" id="lokasi_kerja" placeholder="Contoh: Kabupaten XXX, Provinsi YYY">
        </div>
    </div>

    <div class="form-group">
        <label>Biografi / Deskripsi Singkat</label>
        <textarea id="biografi" placeholder="Tulis tentang diri Anda, pengalaman, dan visi Anda dalam pendidikan..."></textarea>
    </div>

    <div class="button-group">
        <button class="btn-simpan" onclick="simpanAboutInfo()">💾 Simpan Perubahan</button>
        <button class="btn-batal" onclick="kembaliKeDashboard()">❌ Batal</button>
    </div>

    <div class="bottom-spacer"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBq93zwNxWHkBs21i-58v0EhpztkaU3_W4",
            authDomain: "analisis-app-d8d93.firebaseapp.com",
            databaseURL: "https://analisis-app-d8d93-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "analisis-app-d8d93",
            storageBucket: "analisis-app-d8d93.firebasestorage.app",
            messagingSenderId: "1088329722308",
            appId: "1:1088329722308:web:70c80e5b59fc210bff1c91"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let currentUser = null;

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                loadAboutInfo();
            }
        });

        function loadAboutInfo() {
            db.ref(`users_data/${currentUser.uid}/about_info`).on('value', snap => {
                const data = snap.val() || {};
                document.getElementById('nama_developer').value = data.nama_developer || '';
                document.getElementById('email_kontak').value = data.email_kontak || '';
                document.getElementById('telepon_kontak').value = data.telepon_kontak || '';
                document.getElementById('bidang_kerja').value = data.bidang_kerja || '';
                document.getElementById('tahun_pengalaman').value = data.tahun_pengalaman || '';
                document.getElementById('lokasi_kerja').value = data.lokasi_kerja || '';
                document.getElementById('biografi').value = data.biografi || '';
            });
        }

        function simpanAboutInfo() {
            const aboutData = {
                nama_developer: document.getElementById('nama_developer').value.trim(),
                email_kontak: document.getElementById('email_kontak').value.trim(),
                telepon_kontak: document.getElementById('telepon_kontak').value.trim(),
                bidang_kerja: document.getElementById('bidang_kerja').value.trim(),
                tahun_pengalaman: parseInt(document.getElementById('tahun_pengalaman').value) || 0,
                lokasi_kerja: document.getElementById('lokasi_kerja').value.trim(),
                biografi: document.getElementById('biografi').value.trim(),
                updated_at: new Date().toISOString()
            };

            if (!aboutData.nama_developer) {
                Swal.fire('Perhatian', 'Nama lengkap/institusi harus diisi', 'warning');
                return;
            }

            Swal.fire({
                title: 'Menyimpan...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            db.ref(`users_data/${currentUser.uid}/about_info`).set(aboutData).then(() => {
                Swal.fire('Berhasil', 'Informasi profil Anda telah disimpan', 'success');
                setTimeout(() => kembaliKeDashboard(), 1500);
            }).catch(err => {
                Swal.fire('Gagal', 'Terjadi kesalahan: ' + err.message, 'error');
            });
        }

        function kembaliKeDashboard() {
            window.parent.loadPage('dashboard-home.html', null);
        }
    </script>

</body>
</html>

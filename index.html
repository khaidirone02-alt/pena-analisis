<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3498db">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="profile.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Login - PenaAnalisis</title>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root { 
            --primary: #2c3e50; 
            --secondary: #3498db; 
            --accent: #27ae60; 
            --bg: #eaeff2; 
            --white: #ffffff;
            --gradient-text: linear-gradient(45deg, #3498db, #2ecc71);
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--primary); margin: 0; overflow: hidden; }
        
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: white;
            transition: opacity 0.8s ease-out;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .splash-logo {
            width: 40vw;
            max-width: 250px;
            min-width: 150px;
            height: auto;
            margin-bottom: 25px;
            animation: pulse 2s infinite;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.25));
        }

        .brand-name {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 800;
            margin: 0;
            letter-spacing: -1px;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .quote-text {
            font-size: 16px;
            color: #bdc3c7;
            text-align: center;
            max-width: 80%;
            margin-top: 20px;
            min-height: 40px;
        }

        .splash-glow {
            position: absolute;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(52,152,219,0.36) 0%, rgba(52,152,219,0) 70%);
            filter: blur(10px);
            animation: floatGlow 5s ease-in-out infinite;
        }

        .splash-glow.one { top: -120px; left: -120px; }
        .splash-glow.two { bottom: -180px; right: -120px; animation-delay: 1.2s; }

        .splash-progress {
            width: min(340px, 78vw);
            height: 6px;
            border-radius: 999px;
            margin-top: 20px;
            background: rgba(255,255,255,0.2);
            overflow: hidden;
        }

        .splash-progress-bar {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            animation: loadProgress 2.8s ease forwards;
        }

        #toast-container {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 10001;
        }
        .toast {
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-left: 5px solid var(--secondary);
            animation: slideInRight 0.5s ease;
            min-width: 320px;
            max-width: 450px;
            position: relative;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .toast.success { 
            border-left-color: var(--accent); 
            background: linear-gradient(135deg, #d4edda 0%, #ffffff 100%);
        }
        .toast.error { 
            border-left-color: #e74c3c; 
            background: linear-gradient(135deg, #f8d7da 0%, #ffffff 100%);
        }
        .toast.info { 
            border-left-color: var(--secondary); 
            background: linear-gradient(135deg, #d1ecf1 0%, #ffffff 100%);
        }
        
        .toast-icon {
            font-size: 24px;
            flex-shrink: 0;
        }
        
        .toast-content {
            flex: 1;
        }
        
        .toast-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .toast-message {
            font-size: 13px;
            line-height: 1.4;
            color: #555;
        }
        
        .toast-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #999;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        
        .toast-close:hover {
            background: rgba(0,0,0,0.1);
            color: #666;
        }

        #auth-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: linear-gradient(135deg, #2c3e50 0%, #000000 100%); 
        }

        #login-success-splash {
            position: fixed;
            inset: 0;
            background: rgba(21, 34, 46, 0.94);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #fff;
            text-align: center;
        }

        #login-success-splash.show {
            display: flex;
        }

        .success-ring {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.25);
            border-top-color: #2ecc71;
            animation: spin 0.9s linear infinite;
            margin-bottom: 14px;
        }

        .auth-card { 
            background: white; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            width: 90%; 
            max-width: 400px; 
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: var(--secondary);
        }

        .auth-card h2 { color: var(--primary); margin-bottom: 5px; font-size: 24px; }
        .auth-card p { color: #7f8c8d; font-size: 13px; margin-bottom: 25px; }

        .auth-card input { 
            width: 100%; padding: 14px; margin: 8px 0; 
            border: 1px solid #dfe6e9; border-radius: 8px; 
            box-sizing: border-box; background: #f9f9f9;
            transition: 0.3s;
        }
        .auth-card input:focus { border-color: var(--secondary); outline: none; background: white; }
        
        .password-container { position: relative; width: 100%; }
        .toggle-password {
            position: absolute; right: 15px; top: 50%;
            transform: translateY(-50%);
            cursor: pointer; color: #b2bec3; font-size: 18px;
        }
        
        .auth-btn { 
            width: 100%; padding: 14px; 
            background: var(--secondary); color: white; 
            border: none; border-radius: 8px; 
            cursor: pointer; font-weight: bold; font-size: 16px;
            margin-top: 15px; transition: 0.3s;
        }
        .auth-btn:hover { background: #2980b9; transform: translateY(-2px); }

        .switch-auth { margin-top: 20px; font-size: 14px; color: #636e72; }
        .switch-auth b { color: var(--secondary); cursor: pointer; }
        
        .forgot-link { 
            font-size: 12px; color: var(--secondary); 
            display: block; margin-top: 10px; cursor: pointer; 
            text-align: right; text-decoration: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        @keyframes floatGlow {
            0%, 100% { transform: translateY(0); opacity: 0.85; }
            50% { transform: translateY(18px); opacity: 0.62; }
        }

        @keyframes loadProgress {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div id="splash-screen">
    <div class="splash-glow one"></div>
    <div class="splash-glow two"></div>
    <img src="profile.jpeg" class="splash-logo" alt="Logo">
    <h1 class="brand-name animate__animated animate__fadeInDown">PenaAnalisis</h1>
    <div id="quote" class="quote-text animate__animated animate__fadeInUp"></div>
    <div class="splash-progress animate__animated animate__fadeIn">
        <div class="splash-progress-bar"></div>
    </div>
</div>

<div id="auth-container">
    <div class="auth-card animate__animated animate__zoomIn">
        <h2>PenaAnalisis</h2>
        <p id="auth-subtitle">Silakan masuk ke akun Anda</p>
        
        <input type="text" id="auth-displayname" placeholder="Nama Lengkap Guru" style="display: none;">
        <input type="email" id="auth-email" placeholder="Alamat Email">
        
        <div class="password-container">
            <input type="password" id="auth-password" placeholder="Password">
            <span class="toggle-password" onclick="togglePasswordVisibility()">🙈</span>
        </div>
        
        <span class="forgot-link" id="forgot-btn" onclick="forgotPassword()">Lupa Password?</span>
        <button class="auth-btn" id="main-auth-btn" onclick="handleAuth()">Masuk Sekarang</button>
        
        <p class="switch-auth" id="toggle-text">
            Belum memiliki akun? <b onclick="toggleAuthMode()">Daftar Disini</b>
        </p>
    </div>
</div>
<div id="login-success-splash">
    <div class="success-ring"></div>
    <strong style="font-size:20px; margin-bottom:8px;">Login berhasil</strong>
    <span style="font-size:14px; color:#d7e4ee;">Membuka dashboard...</span>
</div>

<script>
    // Konfigurasi Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBq93zwNxWHkBs21i-58v0EhpztkaU3_W4",
        authDomain: "analisis-app-d8d93.firebaseapp.com",
        projectId: "analisis-app-d8d93",
        databaseURL: "https://analisis-app-d8d93-default-rtdb.asia-southeast1.firebasedatabase.app/",
        storageBucket: "analisis-app-d8d93.firebasestorage.app",
        messagingSenderId: "1088329722308",
        appId: "1:1088329722308:web:70c80e5b59fc210bff1c91"
    };
    
    // Inisialisasi Firebase Compat
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    
    const auth = firebase.auth();
    const db = firebase.database();
    const DEVELOPER_EMAIL = "alikhaidir052@gmail.com"; // Isi jika ingin menetapkan akun developer khusus

    async function ensureDeveloperAccount(user) {
        if (!user || !user.email) return;

        const appSettingsRef = db.ref('app_settings');
        let savedDevUid = "";
        let savedDevEmail = "";

        try {
            const snap = await appSettingsRef.once('value');
            const settings = snap.val() || {};
            savedDevUid = settings.developer_uid || "";
            savedDevEmail = settings.developer_email || "";
        } catch (err) {
            console.warn('Tidak dapat membaca app_settings:', err);
            if (err.code === 'PERMISSION_DENIED' || err.code === 'permission_denied') {
                if (user.email === DEVELOPER_EMAIL) {
                    await db.ref('users_data/' + user.uid + '/role').set('developer').catch(() => {});
                }
            }
            return;
        }

        const effectiveDevEmail = savedDevEmail || DEVELOPER_EMAIL || "";
        const isDeveloperEmail = effectiveDevEmail ? user.email === effectiveDevEmail : true;

        if (savedDevUid) {
            if (savedDevUid === user.uid) {
                await db.ref('users_data/' + user.uid + '/role').set('developer');
            } else if (isDeveloperEmail) {
                await appSettingsRef.update({ developer_uid: user.uid, developer_email: effectiveDevEmail });
                await db.ref('users_data/' + user.uid + '/role').set('developer');
            }
            return;
        }

        if (!isDeveloperEmail) {
            return;
        }

        const updateData = { developer_uid: user.uid };
        if (savedDevEmail) {
            updateData.developer_email = savedDevEmail;
        } else if (DEVELOPER_EMAIL) {
            updateData.developer_email = DEVELOPER_EMAIL;
        } else {
            updateData.developer_email = user.email;
        }

        await appSettingsRef.update(updateData).catch(err => {
            console.warn('Tidak dapat memperbarui app_settings:', err);
        });
        await db.ref('users_data/' + user.uid + '/role').set('developer');
    }

    const splashMessages = [
        "Menyiapkan ruang kerja penilaian Anda...",
        "Menyinkronkan data aplikasi...",
        "Hampir selesai, silakan tunggu..."
    ];

    let isLoginMode = true;

    window.onload = () => {
        const quoteEl = document.getElementById('quote');
        quoteEl.innerText = splashMessages[0];
        let msgIndex = 1;
        const msgTicker = setInterval(() => {
            if (msgIndex >= splashMessages.length) return;
            quoteEl.innerText = splashMessages[msgIndex];
            msgIndex++;
        }, 900);
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if(splash) {
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 800);
            }
            clearInterval(msgTicker);
        }, 3000);
    };

    function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        
        // Hapus toast sebelumnya jika ada
        const existingToasts = container.querySelectorAll('.toast');
        existingToasts.forEach(toast => toast.remove());
        
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        
        const icons = {
            success: '🎉',
            error: '⚠️',
            info: '💡',
            warning: '🚨'
        };
        
        const icon = icons[type] || icons.info;
        toast.innerHTML = `
            <div class="toast-icon">${icon}</div>
            <div class="toast-content">
                <div class="toast-title">${type === 'success' ? 'Berhasil' : type === 'error' ? 'Error' : 'Info'}</div>
                <div class="toast-message">${message}</div>
            </div>
            <button class="toast-close" onclick="this.parentElement.remove()">×</button>
        `;
        
        container.appendChild(toast);
        
        // Auto remove setelah 5 detik untuk success, 7 detik untuk error
        const duration = type === 'error' ? 7000 : 5000;
        setTimeout(() => {
            if(toast.parentElement) {
                toast.style.animation = 'slideOutRight 0.5s ease forwards';
                setTimeout(() => toast.remove(), 500);
            }
        }, duration);
    }

    function togglePasswordVisibility() {
        const passInput = document.getElementById('auth-password');
        const icon = document.querySelector('.toggle-password');
        passInput.type = passInput.type === "password" ? "text" : "password";
        icon.innerText = passInput.type === "password" ? "🙈" : "👁️";
    }

    function toggleAuthMode(forceRegister = false) {
        if (forceRegister === true) {
            isLoginMode = false;
        } else {
            isLoginMode = !isLoginMode;
        }

        const card = document.querySelector('.auth-card');
        card.classList.remove('animate__zoomIn', 'animate__flipInY');
        void card.offsetWidth; 
        card.classList.add('animate__flipInY');
        
        document.getElementById('auth-subtitle').innerText = isLoginMode ? "Silakan masuk ke akun Anda" : "Lengkapi data untuk mendaftar";
        document.getElementById('main-auth-btn').innerText = isLoginMode ? "Masuk Sekarang" : "Buat Akun Guru";
        document.getElementById('toggle-text').innerHTML = isLoginMode ? 
            "Belum memiliki akun? <b onclick='toggleAuthMode()'>Daftar Disini</b>" : 
            "Sudah punya akun? <b onclick='toggleAuthMode()'>Login Disini</b>";
        
        document.getElementById('auth-displayname').style.display = isLoginMode ? "none" : "block";
        document.getElementById('forgot-btn').style.display = isLoginMode ? "block" : "none";
    }

    async function handleAuth() {
        const email = document.getElementById('auth-email').value.trim();
        const pass = document.getElementById('auth-password').value;
        const displayName = document.getElementById('auth-displayname').value.trim();

        // Validasi input yang lebih spesifik
        if(!email) {
            showToast("Email wajib diisi!", "error");
            document.getElementById('auth-email').focus();
            return;
        }
        
        if(!pass) {
            showToast("Password wajib diisi!", "error");
            document.getElementById('auth-password').focus();
            return;
        }

        if(!isLoginMode && !displayName) {
            showToast("Nama Lengkap wajib diisi untuk pendaftaran!", "error");
            document.getElementById('auth-displayname').focus();
            return;
        }
        
        // Validasi format email sederhana
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if(!emailRegex.test(email)) {
            showToast("Format email tidak valid!", "error");
            document.getElementById('auth-email').focus();
            return;
        }

        if(pass.length < 6) {
            showToast("Password minimal 6 karakter!", "error");
            document.getElementById('auth-password').focus();
            return;
        }
        
        showToast("Memproses...", "info");
        
        try {
            if(isLoginMode) {
                const userCredential = await auth.signInWithEmailAndPassword(email, pass);
                const user = userCredential.user;
                await ensureDeveloperAccount(user);
                showToast("Berhasil Masuk! Selamat datang kembali.", "success");
            } else {
                if(!displayName) return showToast("Nama Lengkap wajib diisi!", "error");
                const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
                const user = userCredential.user;

                await user.updateProfile({ displayName: displayName });
                await ensureDeveloperAccount(user);
                showToast("Akun berhasil dibuat! Selamat bergabung.", "success");
            }
        } catch (err) {
            console.error(err);
            if (err.code === "auth/wrong-password") {
                showToast("Password yang Anda masukkan salah. Silakan coba lagi.", "error");
                document.getElementById('auth-password').focus();
                document.getElementById('auth-password').select();
            } else if (err.code === "auth/user-not-found") {
                showToast("Email belum terdaftar. Akan dialihkan ke halaman pendaftaran...", "error");
                setTimeout(() => {
                    toggleAuthMode(true);
                    document.getElementById('auth-displayname').focus();
                }, 2000);
            } else if (err.code === "auth/email-already-in-use") {
                showToast("Email sudah terdaftar. Silakan login dengan akun tersebut.", "error");
                if(!isLoginMode) {
                    setTimeout(() => toggleAuthMode(), 1500);
                }
            } else if (err.code === "auth/weak-password") {
                showToast("Password terlalu lemah. Gunakan kombinasi huruf dan angka.", "error");
                document.getElementById('auth-password').focus();
            } else if (err.code === "auth/invalid-email") {
                showToast("Format email tidak valid!", "error");
                document.getElementById('auth-email').focus();
            } else if (err.code === "auth/too-many-requests") {
                showToast("Terlalu banyak percobaan. Coba lagi nanti.", "error");
            } else {
                showToast("Terjadi kesalahan: " + err.message, "error");
            }
        }
    }

    function forgotPassword() {
        const email = document.getElementById('auth-email').value.trim();
        if(!email) return showToast("Isi email untuk reset password", "error");
        auth.sendPasswordResetEmail(email).then(() => {
            showToast("Link reset dikirim ke email", "success");
        }).catch(err => showToast(err.message, "error"));
    }

    // Listener Login tunggal
    let hasRedirectedAfterLogin = false;
    auth.onAuthStateChanged(user => {
        if(user && !hasRedirectedAfterLogin) {
            hasRedirectedAfterLogin = true;
            const successSplash = document.getElementById('login-success-splash');
            if (successSplash) successSplash.classList.add('show');
            setTimeout(() => {
                window.location.replace("dashboard.html");
            }, 1100);
        }
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker terdaftar:', reg.scope))
                .catch(err => console.warn('Service Worker gagal:', err));
        });
    }
</script>
</body>
</html>
